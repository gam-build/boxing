<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boxing PEKUN</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%B1%3C/text%3E%3C/svg%3E">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f3efe7;--fg:#1c1814;--card:#fffdf8;--muted:#6f655a;--accent:#b8321f;--line:#d9d0c1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141210;--fg:#f2ece2;--card:#1f1c19;--muted:#998f82;--accent:#e0503a;--line:#3a342e}}
:root[data-theme="dark"]{--bg:#141210;--fg:#f2ece2;--card:#1f1c19;--muted:#998f82;--accent:#e0503a;--line:#3a342e}
*{margin:0;box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,sans-serif;min-height:100vh}
#app{max-width:480px;margin:0 auto;padding:16px}
h1{font-size:28px;text-align:center;margin:8px 0 4px;font-weight:900;letter-spacing:-.5px}
.sub{text-align:center;color:var(--muted);font-size:14px;margin:6px 0 12px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.modes4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:4px}
.modes4 .btn{padding:10px 4px;font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px;text-align:center;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;transition:border-color .15s}
.card.wide{grid-column:span 2}
.card.taken{opacity:.35;pointer-events:none}
.card:hover,.card:focus-visible{border-color:var(--accent);outline:none}
.face{font-size:38px;line-height:1.1;margin-bottom:4px}
.name{font-weight:800;font-size:16px}
.title{font-size:12px;color:var(--accent);font-weight:800;letter-spacing:.3px;margin-top:2px}
.stats{font-size:12px;color:var(--muted);margin-top:6px}
.desc{font-size:13px;margin-top:4px;font-style:italic}
.hud{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.fbar{flex:1;min-width:0}
.fbar .label{font-size:13px;display:flex;justify-content:space-between;gap:6px;white-space:nowrap}
.fbar .label span:first-child{overflow:hidden;text-overflow:ellipsis}
.bar{height:12px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:4px}
.bar>div{height:100%;transition:width .25s}
.center{text-align:center;min-width:84px}
.round{font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.pts{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px}
canvas{width:100%;height:auto;display:block;border-radius:16px}
.ctrl{margin-top:10px}
.lbl{font-size:12px;color:var(--muted);text-align:center;margin-bottom:2px}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.btn{width:100%;padding:13px 6px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:0;touch-action:manipulation;-webkit-user-select:none;user-select:none;transition:transform .05s,filter .05s}
.btn.pressed{transform:scale(.93);filter:brightness(1.2)}
.btn.alt{background:var(--card);color:var(--fg);border:2px solid var(--line)}
.stick{position:relative;width:112px;height:112px;margin:10px auto 0;border-radius:50%;background:var(--card);border:2px solid var(--line);touch-action:none;user-select:none}
.stick:before{content:"";position:absolute;left:50%;top:50%;width:2px;height:60%;background:var(--line);transform:translate(-50%,-50%)}
.stick:after{content:"";position:absolute;left:50%;top:50%;width:60%;height:2px;background:var(--line);transform:translate(-50%,-50%)}
.knob{position:absolute;top:50%;left:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:var(--accent);box-shadow:0 4px 10px rgba(0,0,0,.3);pointer-events:none}
.keys{font-size:12px;color:var(--muted);text-align:center;margin-top:10px;line-height:1.5}
#log{font-size:14px;color:var(--muted);text-align:center;min-height:22px;margin-top:8px}
.hidden{display:none!important}
#quit{margin-top:12px}
#menu .btn,#fight .btn{margin-top:0}
#over{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:20px}
#over .box{background:var(--card);border-radius:16px;padding:24px;max-width:320px;width:100%;text-align:center}
#over h2{font-size:24px;margin-bottom:6px}
#over p{color:var(--muted);font-size:14px;margin-bottom:12px}

/* Layout landscape (semua mode bertanding) */
#fight.landscape{position:fixed;top:0;left:0;width:100vw;height:100vh;display:grid;grid-template-columns:190px 1fr 190px;grid-template-rows:auto 1fr auto auto auto;gap:6px 10px;padding:8px 10px;background:var(--bg);overflow:hidden;z-index:5}
#fight.landscape.rotated{width:100vh;height:100vw;transform-origin:0 0;transform:translateX(100vw) rotate(90deg)}
#fight.landscape .hud{grid-column:2;grid-row:1;margin:0}
#fight.landscape canvas{grid-column:2;grid-row:2;width:100%;height:100%;min-height:0;object-fit:contain;border-radius:12px}
#fight.landscape #keys{grid-column:2;grid-row:3;margin:0;font-size:11px}
#fight.landscape #log{grid-column:2;grid-row:4;margin:0;min-height:0;font-size:13px}
#fight.landscape #quit{grid-column:2;grid-row:5;margin:0;padding:8px}
#fight.landscape .ctrl{margin:0;grid-row:1/-1}
#fight.landscape .lbl{display:none}
#fight.landscape .actions{grid-template-columns:1fr 1fr;gap:8px}
#fight.landscape .btn{padding:12px 6px;font-size:15px}
#fight.landscape .stick{margin:0 auto;width:120px;height:120px}
/* 1 pemain vs bot: analog di kiri, tombol di kanan */
#fight.landscape:not(.duo) #ctrlP{display:contents}
#fight.landscape:not(.duo) #ctrlP .stick{grid-column:1;grid-row:1/-1;align-self:center;justify-self:center}
#fight.landscape:not(.duo) #ctrlP .actions{grid-column:3;grid-row:1/-1;align-self:center}
/* 2 pemain: tiap pemain punya analog dan tombol di sisinya */
#fight.landscape.duo #ctrlP{grid-column:1;display:flex;flex-direction:column;justify-content:center;gap:10px}
#fight.landscape.duo #ctrlO{grid-column:3;display:flex;flex-direction:column;justify-content:center;gap:10px}
#fight.landscape.duo .stick{margin:0 auto}
#over{z-index:10}
/* Stage tetap 960x440 yang diskalakan agar pas di layar, tidak ada yang terpotong */
#fight.stage{position:fixed;left:50%;top:50%;width:960px;height:440px;display:grid;grid-template-columns:200px 1fr 200px;grid-template-rows:64px 1fr 56px;gap:8px 12px;padding:8px 12px;background:var(--bg);border-radius:18px;transform:translate(-50%,-50%) var(--rot,rotate(0deg)) scale(var(--s,1));transform-origin:50% 50%;z-index:5;overflow:hidden}
#fight.stage .hud{grid-column:1/-1;grid-row:1;margin:0}
#fight.stage canvas{grid-column:2;grid-row:2;width:100%;height:100%;min-height:0;object-fit:contain;border-radius:12px}
#fight.stage #keys{display:none}
#fight.stage #log{grid-column:2;grid-row:3;margin:0;font-size:14px;min-height:0;align-self:center}
#fight.stage #quit{grid-column:3;grid-row:3;margin:0;padding:12px}
#fight.stage .lbl{display:none}
#fight.stage .ctrl{margin:0;grid-row:2;display:flex;flex-direction:column;justify-content:center;gap:10px}
#fight.stage #ctrlP{grid-column:1}
#fight.stage #ctrlO{grid-column:3}
#fight.stage .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#fight.stage .btn{padding:14px 6px;font-size:16px;margin:0}
#fight.stage .stick{margin:0 auto;width:130px;height:130px}
#fight.stage .knob{width:56px;height:56px;margin:-28px 0 0 -28px}
/* 1 pemain vs bot: analog di kiri, tombol di kanan */
#fight.stage:not(.duo) #ctrlP{display:contents}
#fight.stage:not(.duo) #ctrlP .stick{grid-column:1;grid-row:2;align-self:center;justify-self:center;width:170px;height:170px}
#fight.stage:not(.duo) #ctrlP .stick .knob{width:64px;height:64px;margin:-32px 0 0 -32px}
#fight.stage:not(.duo) #ctrlP .actions{grid-column:3;grid-row:2;align-self:center}
#fight.stage:not(.duo) #ctrlP .btn{padding:20px 6px;font-size:17px}
#fight.stage:not(.duo) #ctrlP .actions{gap:10px}
.btn.wpn{grid-column:1/-1}
#arena{grid-column:2;grid-row:2;position:relative;min-height:0;border-radius:12px;overflow:hidden}
#arena canvas{position:absolute;left:0;top:0;width:100%;height:100%;border-radius:12px}
.board-title{font-size:10px;letter-spacing:1px;color:var(--muted)}
.board-main{font-size:12px;font-weight:700;white-space:nowrap}
.board-dots{font-size:13px;letter-spacing:2px;white-space:nowrap}
/* Arena dilebarkan: kolom kontrol lebih sempit, baris atas/bawah lebih tipis (rasio tetap pas) */
#fight.stage{grid-template-columns:160px 1fr 160px;grid-template-rows:48px 1fr 40px;gap:6px 10px;padding:6px 10px}
#fight.stage .btn{padding:10px 4px;font-size:14px}
#fight.stage #quit{padding:8px}
#fight.stage .stick{width:112px;height:112px}
#fight.stage .knob{width:48px;height:48px;margin:-24px 0 0 -24px}
#fight.stage:not(.duo) #ctrlP .stick{width:140px;height:140px}
#fight.stage:not(.duo) #ctrlP .stick .knob{width:56px;height:56px;margin:-28px 0 0 -28px}
#fight.stage:not(.duo) #ctrlP .btn{padding:16px 4px;font-size:15px}
</style>
</head>
<body>
<div id="app">
  <div id="menu">
    <h1>🐱 Boxing PEKUN</h1>
    <p class="sub">Wasit: gaMcuk · 5 match per pertandingan</p>
    <div class="modes">
      <button class="btn" data-mode="1">1 Pemain (vs bot)</button>
      <button class="btn alt" data-mode="2">2 Pemain (satu layar)</button>
    </div>
    <button class="btn alt" id="btnOnline" style="margin-top:8px">🌐 Main Online (kode room)</button>
    <div id="netBox" class="hidden" style="margin-top:8px;text-align:center">
      <div id="netHome">
        <button class="btn" id="netHost">Buat room baru</button>
        <p class="sub">atau gabung ke room temanmu</p>
        <div style="display:flex;gap:8px">
          <input id="netCode" maxlength="5" placeholder="KODE" autocomplete="off" autocapitalize="characters" style="flex:1;min-width:0;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--fg);font-size:18px;text-transform:uppercase;letter-spacing:4px;text-align:center">
          <button class="btn" id="netJoin" style="width:auto;padding:0 20px">Gabung</button>
        </div>
      </div>
      <div id="netWait" class="hidden">
        <p class="sub">Kode room kamu</p>
        <div id="netCodeShow" style="font-size:44px;font-weight:900;letter-spacing:8px;margin:4px 0 8px"></div>
        <button class="btn alt" id="netCopy">Salin kode</button>
      </div>
      <p class="sub" id="netMsg"></p>
      <button class="btn alt" id="netCancel">Batal / keluar room</button>
      <p class="sub" style="opacity:.6;font-size:11px">versi online v10 (ada jalur relay)</p>
    </div>
    <div id="lvlRow"><p class="sub">Level bot</p><div class="modes4" id="levels"></div></div>
    <p class="sub" id="pick"></p>
    <p class="sub">Nama TAR (boleh kosong)</p>
    <input id="brunoName" maxlength="12" style="width:100%;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--fg);font-size:16px;margin-bottom:8px">
    <div class="grid" id="roster"></div>
  </div>

  <div id="fight" class="hidden">
    <div class="hud">
      <div class="fbar">
        <div class="label"><span id="pn"></span><span id="ph"></span></div>
        <div class="bar"><div id="pb"></div></div>
      </div>
      <div class="center">
        <div class="round" id="rd"></div>
        <div class="pts" id="pts"></div>
        <div id="board"></div>
      </div>
      <div class="fbar">
        <div class="label"><span id="on"></span><span id="oh"></span></div>
        <div class="bar"><div id="ob"></div></div>
      </div>
    </div>
    <div id="arena"><canvas id="gl"></canvas><canvas id="ring" width="480" height="260"></canvas></div>

    <div class="ctrl" id="ctrlP">
      <div class="lbl" id="lp"></div>
      <div class="actions">
        <button class="btn" data-p="P" data-a="jab">Jab</button>
        <button class="btn" data-p="P" data-a="hook">Hit</button>
        <button class="btn alt" data-p="P" data-a="block">Tangkis</button>
        <button class="btn alt" data-p="P" data-a="dodge">Hindar</button>
        <button class="btn alt" data-p="P" data-a="jump">Loncat</button>
        <button class="btn" data-p="P" data-a="ult">Ultimate</button>
        <button class="btn alt wpn" data-p="P" data-a="weapon">Senjata</button>
      </div>
      <div class="stick" data-p="P"><div class="knob"></div></div>
    </div>

    <div class="ctrl hidden" id="ctrlO">
      <div class="lbl" id="lo"></div>
      <div class="actions">
        <button class="btn" data-p="O" data-a="jab">Jab</button>
        <button class="btn" data-p="O" data-a="hook">Hit</button>
        <button class="btn alt" data-p="O" data-a="block">Tangkis</button>
        <button class="btn alt" data-p="O" data-a="dodge">Hindar</button>
        <button class="btn alt" data-p="O" data-a="jump">Loncat</button>
        <button class="btn" data-p="O" data-a="ult">Ultimate</button>
        <button class="btn alt wpn" data-p="O" data-a="weapon">Senjata</button>
      </div>
      <div class="stick" data-p="O"><div class="knob"></div></div>
    </div>

    <div class="keys" id="keys"></div>
    <div id="log"></div>
    <button class="btn alt" id="quit">Keluar</button>
  </div>
</div>

<div id="over" class="hidden">
  <div class="box">
    <h2 id="ot"></h2>
    <p id="os"></p>
    <button class="btn" id="next">Match berikutnya</button>
    <button class="btn alt" id="again">Kembali ke menu</button>
  </div>
</div>

<script>
const F = [
  {name:"TAR", title:"SI BANTENG", face:"🐵", badge:"", color:"#b8321f", hood:false, hair:"gimbal", hairColor:"#6b4a2b", hp:95, power:1.0, speed:1.2, desc:"Pukulan berat, gerak lambat"},
  {name:"NUNA", title:"SI JOMBLO AKUT", face:"😭", badge:"", color:"#2e9e4f", hood:true, hood2:"#f5f1e6", hair:"braid", hairColor:"#f4c430", hair2:"#e0a800", hp:95, power:1.0, speed:1.2, desc:"bosen jomblo, butuh pukpuk, kangen sleepcall"},
  {name:"MICU", title:"SI GADIS KITA", face:"😡", badge:"", color:"#7a4a2a", hood:true, hood2:"#e7a3b5", hair:"braid", hairColor:"#2f7fd1", hair2:"#1f5fa8", hp:95, power:1.0, speed:1.2, desc:"mau kentang goreng, mau Koko baru, korban Koko"},
  {name:"GEHENA", title:"SI GACOR", face:"😂", badge:"", color:"#1a1a1a", hood:false, hp:95, power:1.0, speed:1.2, hair:"kribo", hairColor:"#2fbf4a", desc:"butuh lawan, bucin disebelah, orang stres"},
  {name:"SAPIER", title:"PAWANG JAI", face:"😬", badge:"", color:"#6a3fb5", hood:false, hair:"kribosebelah", hairColor:"#2b1d14", hp:95, power:1.0, speed:1.2, desc:"counter Jai, serba Jai, Jai Prabowo"},
  {name:"Vee", title:"HYAAA KALI", face:"🥰", badge:"", color:"#e0508f", hood:false, hp:95, power:1.0, speed:1.2, tall:1.18, hair:"lurus", hairColor:"#1f1722", desc:""},
  {name:"AMOR", title:"DUTA TRIAL", face:"😗", badge:"", color:"#2a7048", hood:false, hp:95, power:1.0, speed:1.2, hair:"botak", hairColor:"#4a3426", desc:"trial 4 hari, duta ancam, duta ludo"}
];
const ROSTER_ORDER = ["AMOR", "NUNA", "MICU", "GEHENA", "TAR", "SAPIER", "Vee"];
F.sort((a, b) => ROSTER_ORDER.indexOf(a.name) - ROSTER_ORDER.indexOf(b.name));
const BOT = {name:"KOKO AYES", title:"", face:"😎", badge:"", color:"#e6c46a", hood:false, hp:95, power:1.0, speed:1.2, hair:"spiky", hairColor:"#d62828"};
const WEAPON_ORDER = ["none", "pisau", "pedang", "pistol", "ketapel", "batu"];
const WEAPONS = {
  none:    {label:"Tangan kosong", kind:"hit",       range:125,  dmg:14, cd:400, hit:0.6,  pts:2},
  pisau:   {label:"Pisau",        kind:"tusukan",   range:95,   dmg:10, cd:420, hit:0.85, pts:2},
  pedang:  {label:"Pedang",       kind:"tebasan",   range:150,  dmg:16, cd:800, hit:0.7,  pts:2},
  pistol:  {label:"Pistol ∞",     kind:"tembakan",  range:9999, dmg:12, cd:600, hit:0.75, pts:2, tracer:"#ffd54a"},
  ketapel: {label:"Ketapel ∞",    kind:"lontaran",  range:9999, dmg:7,  cd:500, hit:0.7,  pts:1, tracer:"#c9d1d9"},
  batu:    {label:"Batu ∞",       kind:"lemparan",  range:9999, dmg:5,  cd:400, hit:0.6,  pts:1, tracer:"#8b7d6b"}
};
const LEVELS = {
  mudah:  {label:"Mudah",  delay:1.8, aggr:0.25, block:0.10, dmg:0.7},
  sedang: {label:"Sedang", delay:1.2, aggr:0.45, block:0.20, dmg:1.0},
  sulit:  {label:"Sulit",  delay:0.8, aggr:0.60, block:0.30, dmg:1.1},
  bos:    {label:"Bos",    delay:0.5, aggr:0.75, block:0.40, dmg:1.3}
};
let level = "sedang";
const REF = "gaMcuk";

const CW = 480, CH = 260, GROUND = 200;
const ROUND_LEN = 20, ROUNDS = 3, MATCHES = 5;
let matchNo = 1;
const RANGE = 125, MIN_GAP = 56, XMIN = 40, XMAX = 440;
const ctx = document.getElementById("ring").getContext("2d");
const $ = id => document.getElementById(id);
const FONT = "'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',system-ui,sans-serif";

let P, O, round, time, over = false, twoP = false, pickStage = 0, p1Idx = -1;
let aiT = null, clk = null, raf = null, refT = -9999;

const MOVE_KEYS = { a: ["P", -1], d: ["P", 1], j: ["O", -1], l: ["O", 1] };
const ACT_KEYS = {
  q: ["P", "jab"], w: ["P", "hook"], e: ["P", "block"], r: ["P", "dodge"],
  i: ["O", "jab"], o: ["O", "hook"], k: ["O", "block"], u: ["O", "dodge"]
};

function init() {
  document.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => setMode(+b.dataset.mode));

  $("roster").onclick = e => {
    const c = e.target.closest(".card");
    if (c && !c.classList.contains("taken")) pick(+c.dataset.i);
  };
  $("levels").onclick = e => {
    const b = e.target.closest("[data-lv]");
    if (b) { level = b.dataset.lv; renderLevels(); }
  };

  // Tombol merespons saat jari menyentuh layar (tanpa menunggu lepas)
  document.querySelectorAll("[data-a]").forEach(b => {
    b.addEventListener("pointerdown", e => {
      e.preventDefault();
      b.classList.add("pressed");
      press(b.dataset.p, b.dataset.a);
    });
    const off = () => b.classList.remove("pressed");
    b.addEventListener("pointerup", off);
    b.addEventListener("pointerleave", off);
    b.addEventListener("pointercancel", off);
  });
  document.querySelectorAll(".stick").forEach(bindStick);
  $("quit").onclick = toMenu;
  $("again").onclick = toMenu;
  $("next").onclick = () => { matchNo++; $("over").classList.add("hidden"); beginMatch(); };

  document.addEventListener("keydown", e => {
    if (over || $("fight").classList.contains("hidden")) return;
    const k = e.key.toLowerCase();
    if (MOVE_KEYS[k]) {
      const [who, dir] = MOVE_KEYS[k];
      if (who === "O" && !twoP) return;
      (who === "P" ? P : O).ax = dir;
      return;
    }
    if (k === "c" || k === "m") {
      const who = k === "c" ? "P" : "O";
      if (who === "O" && !twoP) return;
      press(who, "ult");
      return;
    }
    if (k === "z" || k === "n") {
      const who = k === "z" ? "P" : "O";
      if (who === "O" && !twoP) return;
      press(who, "jump");
      return;
    }
    if (k === "t" || k === "y") {
      const who = k === "t" ? "P" : "O";
      if (who === "O" && !twoP) return;
      cycleWeapon(who === "P" ? P : O);
      return;
    }
    if (ACT_KEYS[k]) {
      if (e.repeat) return;
      const [who, type] = ACT_KEYS[k];
      if (who === "O" && !twoP) return;
      press(who, type);
    }
  });
  document.addEventListener("keyup", e => {
    const m = MOVE_KEYS[e.key.toLowerCase()];
    if (m && P && O) (m[0] === "P" ? P : O).ax = 0;
  });

  setMode(1);
}

/* Joystick analog: geser knob ke kiri/kanan untuk bergerak */
function bindStick(el) {
  const knob = el.querySelector(".knob");
  const who = el.dataset.p;
  let R = 36;
  let id = null;
  const target = () => (who === "P" ? P : O);
  const update = e => {
    R = el.clientWidth * 0.36;
    const dx = Math.max(-R, Math.min(R, e.offsetX - el.clientWidth / 2));
    knob.style.transform = `translateX(${dx}px)`;
    let a = dx / R;
    if (Math.abs(a) < 0.15) a = 0;
    const f = target();
    if (f && (who === "P" || twoP)) f.ax = a;
  };
  const reset = () => {
    id = null;
    knob.style.transform = "translateX(0px)";
    const f = target();
    if (f) f.ax = 0;
  };
  el.addEventListener("pointerdown", e => {
    if (over || !P || !O) return;
    id = e.pointerId;
    el.setPointerCapture(id);
    update(e);
    e.preventDefault();
  });
  el.addEventListener("pointermove", e => { if (e.pointerId === id) update(e); });
  el.addEventListener("pointerup", reset);
  el.addEventListener("pointercancel", reset);
}

function renderLevels() {
  $("lvlRow").classList.toggle("hidden", twoP);
  $("levels").innerHTML = Object.keys(LEVELS).map(k =>
    `<button class="btn${k === level ? "" : " alt"}" data-lv="${k}">${LEVELS[k].label}</button>`
  ).join("");
}

function setMode(m) {
  twoP = m === 2;
  pickStage = 0;
  p1Idx = -1;
  document.querySelectorAll("[data-mode]").forEach(b => b.classList.toggle("alt", +b.dataset.mode !== m));
  renderRoster();
  updatePickText();
}

function renderRoster() {
  $("roster").innerHTML = F.map((f, i) => {
    const taken = twoP && pickStage === 1 && i === p1Idx;
    return `
    <div class="card${i === F.length - 1 && F.length % 2 ? " wide" : ""}${taken ? " taken" : ""}" data-i="${i}">
      <div class="face">${f.face}</div>
      <div class="name">${f.name}</div>
      <div class="title">${f.title}</div>
      <div class="stats">HP ${Math.round(f.hp * 2.2)} · Pukul ${f.power} · Gerak ${f.speed}</div>
      <div class="desc">${f.desc}</div>
    </div>`;
  }).join("");
}

function updatePickText() {
  renderLevels();
  if (!twoP) $("pick").textContent = "Pilih petinjumu. Lawan bot: KOKO AYES.";
  else if (pickStage === 0) $("pick").textContent = "Pemain 1, pilih petinjumu";
  else $("pick").textContent = "Pemain 2, pilih petinjumu";
}

function pick(i) {
  if (!twoP) { start(i, null); return; }
  if (pickStage === 0) {
    p1Idx = i;
    pickStage = 1;
    renderRoster();
    updatePickText();
  } else {
    const p1 = p1Idx;
    pickStage = 0;
    p1Idx = -1;
    updatePickText();
    start(p1, i);
  }
}

function mk(f, dir, x) {
  return { ...f, max: Math.round(f.hp * 2.2), hp: Math.round(f.hp * 2.2), dir, x, pts: 0, weapon: "none", shot: null, ult: 0, ax: 0, axUntil: 0, punchT: -9999, punchType: null, blockUntil: 0, dodgeUntil: 0, cdUntil: 0, hitT: -9999 };
}

function cycleWeapon(f) {
  if (!f) return;
  const i = WEAPON_ORDER.indexOf(f.weapon);
  f.weapon = WEAPON_ORDER[(i + 1) % WEAPON_ORDER.length];
  updateWeaponLabels();
  log(`${f.name} pakai ${WEAPONS[f.weapon].label}.`);
}

function updateWeaponLabels() {
  ["P", "O"].forEach(who => {
    const f = who === "P" ? P : O;
    const text = "Senjata: " + (f ? WEAPONS[f.weapon].label : WEAPONS.none.label);
    document.querySelectorAll(`[data-p="${who}"][data-a="weapon"]`).forEach(b => b.textContent = text);
  });
}

function drawHairExtra(f, x, top) {
  if (f.hair === "braid") {
    for (const side of [-1, 1]) {
      for (let i = 0; i < 9; i++) {
        ctx.fillStyle = i % 2 ? f.hair2 : f.hairColor;
        ctx.beginPath();
        ctx.arc(x + side * (25 + Math.sin(i * 0.8) * 1.5), top - 102 + i * 5.5, 4.2, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  } else if (f.hair === "kribo") {
    ctx.fillStyle = f.hairColor;
    for (let i = 0; i < 14; i++) {
      const a = Math.PI * (1 + i / 13);
      ctx.beginPath();
      ctx.arc(x + Math.cos(a) * 22, top - 118 + Math.sin(a) * 22, 7, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.beginPath();
    ctx.arc(x, top - 126, 13, 0, Math.PI * 2);
    ctx.fill();
  } else if (f.hair === "botak") {
    ctx.fillStyle = f.hairColor;
    ctx.beginPath();
    ctx.arc(x, top - 118, 19.5, Math.PI * 0.5, Math.PI * 1.5);
    ctx.closePath();
    ctx.fill();
  } else if (f.hair === "gimbal") {
    ctx.fillStyle = f.hairColor;
    for (let i = 0; i < 20; i++) {
      const a = Math.PI * (0.95 + (i / 19) * 1.1);
      const r = 22 + (i % 3) * 3;
      ctx.beginPath();
      ctx.arc(x + Math.cos(a) * r, top - 118 + Math.sin(a) * r, 6 + (i % 2) * 2, 0, Math.PI * 2);
      ctx.fill();
    }
  } else if (f.hair === "kribosebelah") {
    ctx.fillStyle = f.hairColor;
    [[-22, -122, 11], [-27, -109, 10], [-19, -134, 10], [-32, -123, 9], [-13, -141, 8], [-25, -98, 8]].forEach(([dx, dy, r]) => {
      ctx.beginPath(); ctx.arc(x + dx, top + dy, r, 0, Math.PI * 2); ctx.fill();
    });
  } else if (f.hair === "lurus") {
    ctx.fillStyle = f.hairColor;
    ctx.beginPath(); ctx.arc(x, top - 118, 21, Math.PI, Math.PI * 2); ctx.closePath(); ctx.fill();
    roundRectPath(x - 25, top - 122, 10, 64, 5); ctx.fill();
    roundRectPath(x + 15, top - 122, 10, 64, 5); ctx.fill();
    ctx.strokeStyle = shade(f.hairColor, 0.4);
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x - 20, top - 112); ctx.lineTo(x - 20, top - 70); ctx.moveTo(x + 20, top - 112); ctx.lineTo(x + 20, top - 70); ctx.stroke();
  } else if (f.hair === "spiky") {
    ctx.fillStyle = f.hairColor;
    ctx.beginPath();
    for (let i = 0; i <= 10; i++) {
      const a = Math.PI * (1.02 + i * 0.096);
      const r = i % 2 ? 16 : 30;
      const px = x + Math.cos(a) * r, py = top - 118 + Math.sin(a) * r;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
  }
}

function drawWeapon(name, gx, gy, d) {
  ctx.save();
  ctx.translate(gx, gy);
  ctx.scale(d, 1);
  if (name === "pisau") {
    ctx.fillStyle = "#3a2a1e";
    ctx.fillRect(-7, -3, 8, 6);
    ctx.fillStyle = "#dfe6ec";
    ctx.beginPath(); ctx.moveTo(1, -4); ctx.lineTo(20, 0); ctx.lineTo(1, 4); ctx.closePath(); ctx.fill();
  } else if (name === "pedang") {
    ctx.fillStyle = "#c9a227";
    ctx.fillRect(-4, -5, 4, 10);
    ctx.fillStyle = "#e6edf3";
    ctx.fillRect(0, -2, 46, 4);
    ctx.beginPath(); ctx.moveTo(46, -2); ctx.lineTo(54, 0); ctx.lineTo(46, 2); ctx.closePath(); ctx.fill();
  } else if (name === "pistol") {
    ctx.fillStyle = "#2b2b2b";
    ctx.fillRect(-2, -4, 20, 7);
    ctx.fillRect(-2, 3, 6, 8);
  } else if (name === "ketapel") {
    ctx.strokeStyle = "#6b4a2b";
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-2, -12); ctx.lineTo(-9, 0); ctx.lineTo(-2, 12); ctx.stroke();
    ctx.strokeStyle = "#2b2b2b";
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(-2, -12); ctx.lineTo(8, 0); ctx.lineTo(-2, 12); ctx.stroke();
  } else if (name === "batu") {
    ctx.fillStyle = "#8b7d6b";
    ctx.beginPath(); ctx.arc(4, 0, 6, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

function drawShots(t) {
  [P, O].forEach(f => {
    if (!f || !f.shot || t - f.shot.t > 160) return;
    const other = f === P ? O : P;
    const ay = GROUND - 92;
    ctx.strokeStyle = f.shot.col;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(f.x + f.dir * 20, ay);
    ctx.lineTo(other.x, ay - 4);
    ctx.stroke();
  });
}

function fitStage() {
  const f = $("fight");
  if (f.classList.contains("hidden")) return;
  const vw = window.innerWidth, vh = window.innerHeight;
  const rot = vh > vw;
  const W = 960, H = 440;
  const s = rot ? Math.min(vh / W, vw / H) : Math.min(vw / W, vh / H);
  f.style.setProperty("--rot", rot ? "rotate(90deg)" : "rotate(0deg)");
  f.style.setProperty("--s", s);
}

function applyLayout() {
  const f = $("fight");
  const land = !f.classList.contains("hidden");
  f.classList.toggle("stage", land);
  fitStage();
  f.classList.toggle("duo", twoP);

  if (land && screen.orientation && screen.orientation.lock) {
    screen.orientation.lock("landscape").catch(() => {});
  }
}
window.addEventListener("resize", applyLayout);

function start(pi, oi) {
  P = mk(F[pi], 1, 150);
  O = oi === null ? mk(BOT, -1, 330) : mk(F[oi], -1, 330);
  applyBrunoName(P, F[pi]);
  if (oi !== null) applyBrunoName(O, F[oi]);
  if (oi === null) O.weapon = WEAPON_ORDER[Math.floor(Math.random() * WEAPON_ORDER.length)];
  updateDirs();
  round = 1;
  time = ROUND_LEN;
  over = false;
  matchNo = 1;

  $("menu").classList.add("hidden");
  $("fight").classList.remove("hidden");
  $("pn").textContent = P.face + " " + P.name + (twoP ? " (P1)" : "");
  $("on").textContent = O.name + (twoP ? " (P2)" : " (bot " + LEVELS[level].label + ")");
  $("pb").style.background = P.color;
  $("ob").style.background = O.color;
  $("lp").textContent = twoP ? `Pemain 1 · ${P.name}` : P.name;
  $("lo").textContent = `Pemain 2 · ${O.name}`;
  $("ctrlO").classList.toggle("hidden", !twoP);
  updateWeaponLabels();
  $("keys").textContent = twoP
    ? "P1: A/D gerak · Q jab · W hit · E tangkis · R hindar   |   P2: J/L gerak · I jab · O hit · K tangkis · U hindar"
    : "A/D gerak · Q jab · W hit · E tangkis · R hindar";
  applyLayout();

  refT = performance.now();
  log(`${REF}: Ronde 1 dari ${ROUNDS}. Silakan bertarung!`);
  hud();

  clearTimeout(aiT);
  if (!twoP) aiT = setTimeout(ai, 1000);
  clearInterval(clk);
  clk = setInterval(tick, 100);
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(frame);
}

function toMenu() {
  over = true;
  clearTimeout(aiT);
  clearInterval(clk);
  cancelAnimationFrame(raf);
  $("over").classList.add("hidden");
  $("fight").classList.add("hidden");
  $("menu").classList.remove("hidden");
  setMode(twoP ? 2 : 1);
}

function updateDirs() {
  const d = O.x > P.x ? 1 : -1;
  P.dir = d;
  O.dir = -d;
}

function press(who, type) {
  if (over) return;
  const f = who === "P" ? P : O;
  if (!f || (!twoP && f === O)) return;
  if (performance.now() < (f.stunUntil || 0) && type !== "ult") { log(`${f.name} terkunci!`); return; }
  if (type === "block") { tangkis(f); return; }
  if (type === "dodge") { hindar(f); return; }
  if (type === "weapon") { cycleWeapon(f); return; }
  if (type === "jump") { jumpF(f); return; }
  if (type === "ult") { ultimate(f); return; }
  attack(f, f === P ? O : P, type);
}

/* Gerak analog: dijalankan tiap frame */
function moveAll() {
  if (over || !P || !O) return;
  if (!twoP && performance.now() > O.axUntil) O.ax = 0;
  const now = performance.now();
  [P, O].forEach(f => {
    if (now < (f.stunUntil || 0)) return;
    let a = f.ax;
    if (now < (f.reverseUntil || 0)) a = -a;
    if (a) moveFighter(f, a);
  });
}

function moveFighter(f, a) {
  const opp = f === P ? O : P;
  const spd = f.boostUntil && performance.now() < f.boostUntil ? 1.6 : 1;
  let nx = f.x + a * 3.2 * f.speed * spd;
  nx = Math.max(XMIN, Math.min(XMAX, nx));
  f.x = Math.max(XMIN, Math.min(XMAX, nx));
  updateDirs();
}

/* Bot: gerak ke arah lawan (maju) atau menjauh (mundur) */
function botMove(forward, ms) {
  const s = Math.sign(P.x - O.x) || 1;
  O.ax = forward ? s : -s;
  O.axUntil = performance.now() + ms;
}

function tangkis(f) {
  const t = performance.now();
  if (t < f.cdUntil) return;
  f.blockUntil = t + 700;
  f.cdUntil = t + 350;
  log(`${f.name} menangkis!`);
}

function hindar(f) {
  const t = performance.now();
  if (t < f.cdUntil) return;
  f.dodgeUntil = t + 450;
  f.cdUntil = t + 600;
  log(`${f.name} menghindar!`);
}

function attack(a, d, type) {
  const t = performance.now();
  if (t < a.cdUntil || over) return;
  if (inAir(a, t)) { log(`${a.name} masih di udara!`); return; }
  if (t < (a.stunUntil || 0)) { log(`${a.name} terlilit, tidak bisa menyerang!`); return; }
  const w = type === "jab" ? { label: "", kind: "jab", range: 125, dmg: 6, cd: 200, hit: 0.8, pts: 1 } : WEAPONS[a.weapon || "none"];
  const isWeapon = type !== "jab" && (a.weapon || "none") !== "none";
  a.cdUntil = t + w.cd / a.speed;
  a.punchT = t;
  a.punchType = (type === "jab" || (isWeapon && w.kind !== "tebasan")) ? "jab" : "hook";
  if (w.tracer) a.shot = { t, col: w.tracer };
  const kind = w.kind;
  const gap = Math.abs(d.x - a.x);
  if (gap > w.range && gap <= w.range + 70 && w.range < 9999) {
    const s = Math.sign(d.x - a.x) || 1;
    a.x = Math.max(XMIN, Math.min(XMAX, d.x - s * Math.max(MIN_GAP, w.range - 6)));
    updateDirs();
  }
  if (Math.abs(d.x - a.x) > w.range) { log(`${a.name} ${kind} kejauhan!`); return; }
  if (d.dodgeUntil > t || inAir(d, t)) { log(`${d.name} menghindar dari ${kind} ${a.name}!`); return; }
  if (Math.random() > w.hit) { log(`${a.name} ${kind} meleset.`); return; }
  let dmg = w.dmg * a.power * 0.6 * (0.8 + Math.random() * 0.4);
  if (!twoP && a === O) dmg *= LEVELS[level].dmg;
  const pts = w.pts;
  if (d.blockUntil > t) {
    dmg *= 0.3;
    log(`${a.name} ${kind} ditangkis! -${Math.round(dmg)} HP`);
  } else {
    a.ult = Math.min(100, a.ult + 12);
    d.ult = Math.min(100, d.ult + 8);
    log(`${a.name} ${kind} kena! -${Math.round(dmg)} HP`);
  }
  d.hp = Math.max(0, d.hp - dmg);
  d.hitT = t;
  hud();
  if (d.hp <= 0) endFight("ko", a);
}

function attackOld(a, d, type) {
  const t = performance.now();
  if (t < a.cdUntil || over) return;
  const jab = type === "jab";
  a.punchT = t;
  a.punchType = type;
  a.cdUntil = t + (jab ? 280 : 550) / a.speed;

  const kind = jab ? "jab" : "hit";
  if (Math.abs(d.x - a.x) > RANGE) {
    log(`${a.name} ${kind} kejauhan!`);
    return;
  }
  if (d.dodgeUntil > t) {
    log(`${d.name} menghindar dari ${kind} ${a.name}!`);
    return;
  }
  const hitChance = jab ? 0.8 : 0.6;
  if (Math.random() > hitChance) {
    log(`${a.name} ${kind} meleset.`);
    return;
  }

  let dmg = (jab ? 6 : 14) * a.power * (0.8 + Math.random() * 0.4);
  if (!twoP && a === O) dmg *= LEVELS[level].dmg;
  const blocked = d.blockUntil > t;
  if (blocked) {
    dmg *= 0.3;
    log(`${a.name} ${kind} ditangkis! -${Math.round(dmg)} HP`);
  } else {
    a.pts += jab ? 1 : 2;
    log(`${a.name} ${kind} kena! +${jab ? 1 : 2} poin, -${Math.round(dmg)} HP`);
  }
  d.hp = Math.max(0, d.hp - dmg);
  d.hitT = t;
  hud();
  if (d.hp <= 0) endFight("ko", a);
}

function ai() {
  if (over || twoP) return;
  const dist = Math.abs(O.x - P.x);
  const r = Math.random();
  const L = LEVELS[level];
  if (O.ult >= 100 && Math.random() < 0.25) ultimate(O);
  if (!inAir(O, performance.now()) && Math.random() < 0.08 + L.aggr * 0.12) jumpF(O);
  const bw = RANGE;
  if (dist > bw) {
    botMove(true, 450);
  } else if (r < L.aggr * 0.5) {
    attack(O, P, "jab");
  } else if (r < L.aggr * 0.8) {
    attack(O, P, "hook");
  } else if (r < L.aggr * 0.8 + L.block) {
    tangkis(O);
  } else {
    attack(O, P, "hook");
  }
  aiT = setTimeout(ai, (600 + Math.random() * 600) * L.delay / O.speed);
}

function tick() {
  if (over) return;
  time = Math.max(0, time - 0.1);
  P.ult = Math.min(100, P.ult + 0.15);
  O.ult = Math.min(100, O.ult + 0.15);
  if (time <= 0) {
    if (round >= ROUNDS) { endFight("points"); return; }
    log(`${REF}: Ronde ${round} selesai. Poin ${P.pts} - ${O.pts}`);
    round++;
    time = ROUND_LEN;
    P.x = 150;
    O.x = 330;
    updateDirs();
    refT = performance.now();
  }
  hud();
}

function beginMatch() {
  P.hp = P.max;
  O.hp = O.max;
  P.x = 150;
  O.x = 330;
  P.ax = 0;
  O.ax = 0;
  updateDirs();
  round = 1;
  time = ROUND_LEN;
  over = false;
  refT = performance.now();
  log(`${REF}: Match ${matchNo} dimulai! Silakan bertarung.`);
  hud();
  clearTimeout(aiT);
  if (!twoP) aiT = setTimeout(ai, 1000);
  clearInterval(clk);
  clk = setInterval(tick, 100);
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(frame);
}

function endFight(how, w) {
  if (over) return;
  over = true;
  clearTimeout(aiT);
  clearInterval(clk);
  refT = performance.now();
  let winner = null;
  if (how === "ko") winner = w;
  else if (P.hp !== O.hp) winner = P.hp > O.hp ? P : O;
  if (winner) winner.pts += 1;
  hud();
  let title, sub;
  if (matchNo >= MATCHES) {
    const champ = P.pts === O.pts ? null : (P.pts > O.pts ? P : O);
    title = champ ? `${champ.name} juara!` : "Seri akhir";
    sub = `Skor akhir ${P.name} ${P.pts} - ${O.pts} ${O.name}.`;
    $("next").classList.add("hidden");
    log(`${REF}: Pertandingan selesai!`);
  } else {
    title = winner ? `${winner.name} menang match ${matchNo}` : `Match ${matchNo} seri`;
    sub = `Skor ${P.name} ${P.pts} - ${O.pts} ${O.name}. Lanjut ke match ${matchNo + 1}?`;
    $("next").classList.remove("hidden");
    log(`${REF}: ${title}!`);
  }
  $("ot").textContent = title;
  $("os").textContent = sub;
  $("over").classList.remove("hidden");
}

function endFightOld(how, w) {
  if (over) return;
  over = true;
  clearTimeout(aiT);
  clearInterval(clk);
  refT = performance.now();
  let title, sub;
  if (how === "ko") {
    title = `KO! ${w.name} menang`;
    sub = `${REF} menghentikan pertandingan. Poin ${P.pts} - ${O.pts}.`;
    log(`${REF}: Satu... dua... tiga... KO!`);
  } else if (P.pts === O.pts) {
    title = "Seri";
    sub = `Poin sama, ${P.pts} - ${O.pts}.`;
    log(`${REF}: Pertandingan seri!`);
  } else {
    const win = P.pts > O.pts ? P : O;
    title = `${win.name} menang!`;
    sub = `Poin akhir ${P.pts} - ${O.pts}.`;
    log(`${REF}: ${win.name} dinyatakan menang!`);
  }
  hud();
  $("ot").textContent = title;
  $("os").textContent = sub;
  $("over").classList.remove("hidden");
}

function hud() {
  $("ph").textContent = Math.ceil(P.hp) + "/" + P.max;
  $("oh").textContent = Math.ceil(O.hp) + "/" + O.max;
  $("pb").style.width = (P.hp / P.max * 100) + "%";
  $("ob").style.width = (O.hp / O.max * 100) + "%";
  $("rd").textContent = `M${matchNo} · R${round}/${ROUNDS} · ${Math.ceil(time)}s`;
  $("pts").textContent = `${P.pts} : ${O.pts}`;
  updateUltLabels();
}

let banner = null;
function log(m) {
  $("log").textContent = m;
  banner = { text: m, t: performance.now() };
}

function drawBanner(t) {
  if (!banner || t - banner.t > 1400) return;
  const alpha = Math.min(1, (1400 - (t - banner.t)) / 400);
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.font = "bold 13px system-ui, sans-serif";
  ctx.textAlign = "center";
  const w = ctx.measureText(banner.text).width + 24;
  ctx.fillStyle = "rgba(0,0,0,.6)";
  roundRectPath(CW / 2 - w / 2, 8, w, 26, 13);
  ctx.fill();
  ctx.fillStyle = "#ffffff";
  ctx.fillText(banner.text, CW / 2, 26);
  ctx.restore();
}

/* ---------- Gambar ---------- */

function frame() {
  moveAll();

<script>
/* Ultimate tiap karakter dan kemampuan pindah ke seberang lawan */
const ULT_NAMES = {
  "Bruno": "Banteng Ngamuk",
  "NUNA": "Sundulan Jomblo",
  "MICU": "Tamparan Gadis",
  "GEHENA": "Tendangan Gacor",
  "AMOR": "Jambakan TRIAL",
  "SAPIER": "Sepak Pier",
  "Vee": "Peluk Tampar Meledak",
  "KOKO AYES": "JURUS BODO AMAT"
};
function ultName(f) { return ULT_NAMES[f.key || f.name] || "Ultimate"; }

function dealDamage(a, d, dmg, kind) {
  const t = performance.now();
  if (over) return;
  if (d.dodgeUntil > t || inAir(d, t)) { log(`${d.name} menghindar dari ${kind}!`); return; }
  if (d.blockUntil > t) dmg *= 0.5;
  d.hp = Math.max(0, d.hp - dmg);
  d.hitT = t;
  d.ult = Math.min(100, d.ult + 8);
  a.ult = Math.min(100, a.ult + 6);
  log(`${a.name} ${kind}! -${Math.round(dmg)} HP`);
  hud();
  if (d.hp <= 0) endFight("ko", a);
}

function ultimate(f) {
  if (over || !f) return;
  if (f.ult < 100) { log(`${f.name}: ultimate baru ${Math.floor(f.ult)}%`); return; }
  const t = performance.now();
  const d = f === P ? O : P;
  const scale = (!twoP && f === O) ? LEVELS[level].dmg : 1;
  f.ult = 0;
  f.cdUntil = t + 400;
  log(`${f.name} pakai ${ultName(f)}!`);
  ultFx.push({ who: f, t, label: "⚡ " + ultName(f).toUpperCase() + "!", color: f.color });

  switch (f.key || f.name) {
    case "Bruno":
    case "KOKO AYES": {
      const s = Math.sign(d.x - f.x) || 1;
      f.x = Math.max(XMIN, Math.min(XMAX, d.x - s * 50));
      updateDirs();
      f.punchT = t;
      f.punchType = "hook";
      const base = f.name === "Bruno" ? 30 : 26;
      dealDamage(f, d, base * f.power * scale, "tinju ultimate");
      break;
    }
    case "NUNA":
      d.stunUntil = t + 4000;
      log(`${d.name} terlilit kepang ${f.name}!`);
      break;
    case "MICU":
      for (let i = 0; i < 6; i++) {
        setTimeout(() => {
          if (over || Math.abs(d.x - f.x) > RANGE + 60) return;
          dealDamage(f, d, 4 * f.power * scale, "kombo kilat");
        }, i * 220);
      }
      break;
    case "GEHENA":
      f.hp = Math.min(f.max, f.hp + 30);
      f.boostUntil = t + 5000;
      hud();
      break;
    case "SAPIER": {
      const s = Math.sign(d.x - f.x) || 1;
      f.x = Math.max(XMIN, Math.min(XMAX, d.x - s * 55));
      updateDirs();
      f.punchT = t;
      f.punchType = "hook";
      dealDamage(f, d, 30 * f.power * scale, "sepak pier");
      break;
    }
    case "Vee": {
      const s = Math.sign(d.x - f.x) || 1;
      f.x = Math.max(XMIN, Math.min(XMAX, d.x - s * 46));
      updateDirs();
      f.punchT = t;
      f.punchType = "jab";
      d.stunUntil = t + 700;
      log(`${f.name} memeluk ${d.name}...`);
      setTimeout(() => { if (!over) dealDamage(f, d, 36 * f.power * scale, "tampar meledak"); }, 600);
      break;
    }
    case "AMOR":
      d.reverseUntil = t + 5000;
      log(`${d.name} kena Jambakan TRIAL, gerakan terbalik!`);
      break;
  }
  hud();
}

function updateUltLabels() {
  [["P", P], ["O", O]].forEach(([who, f]) => {
    document.querySelectorAll(`[data-p="${who}"][data-a="ult"]`).forEach(b => {
      if (!f) { b.textContent = "Ultimate"; return; }
      b.textContent = f.ult >= 100 ? `⚡ ${ultName(f)}` : `Ultimate ${Math.floor(f.ult)}%`;
    });
  });
}

<script>
/* Efek visual ultimate: cincin energi, kilatan layar, dan nama jurus besar */
const ultFx = [];
const drawBaseFx = draw;
draw = function (t) {
  drawBaseFx(t);
  drawUltFx(t);
};

function drawUltFx(t) {
  for (let i = ultFx.length - 1; i >= 0; i--) {
    if (t - ultFx[i].t > 1800) ultFx.splice(i, 1);
  }
  ultFx.forEach(fx => {
    const age = t - fx.t;
    const p = age / 1800;
    const f = fx.who;
    ctx.save();

    ctx.globalAlpha = Math.max(0, 1 - p);
    ctx.strokeStyle = fx.color;
    ctx.lineWidth = 6 * (1 - p) + 2;
    ctx.beginPath();
    ctx.arc(f.x, GROUND - 60, 30 + p * 90, 0, Math.PI * 2);
    ctx.stroke();

    if (age < 300) {
      ctx.globalAlpha = (1 - age / 300) * 0.35;
      ctx.fillStyle = fx.color;
      ctx.fillRect(0, 0, CW, CH);
    }

    ctx.globalAlpha = age > 1300 ? (1800 - age) / 500 : 1;
    const s = age < 250 ? 0.6 + (age / 250) * 0.5 : 1.1;
    ctx.translate(CW / 2, 96);
    ctx.scale(s, s);
    ctx.font = "900 26px system-ui, sans-serif";
    ctx.textAlign = "center";
    ctx.lineWidth = 6;
    ctx.strokeStyle = "rgba(0,0,0,.75)";
    ctx.strokeText(fx.label, 0, 0);
    ctx.fillStyle = "#ffe066";
    ctx.fillText(fx.label, 0, 0);

    ctx.restore();
  });
}

<script>

function makeFighter(f) {
  const g = new THREE.Group();
  const M = (c, r) => new THREE.MeshStandardMaterial({ color: c, roughness: r === undefined ? 0.6 : r });
  const skin = M(0xe2aa7a), shirt = M(f.color, 0.5), shorts = M(0x1d1b24, 0.7), shoe = M(0x17171f, 0.4);

function poseFighter(g, f, t) {

/* ----- Suara (dibuat langsung dengan Web Audio, tanpa file) ----- */
let AC = null, NB = null;
function ac() {
  if (!AC) {
    try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
  }
  if (AC.state === "suspended") AC.resume();
  return AC;
}
function noiseBuf(a) {
  if (!NB) {
    NB = a.createBuffer(1, a.sampleRate * 0.5, a.sampleRate);
    const d = NB.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  return NB;
}
function tone(f0, f1, dur, type, vol) {
  const a = ac(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, a.currentTime);
  o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), a.currentTime + dur);
  g.gain.setValueAtTime(vol, a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + dur);
  o.connect(g).connect(a.destination);
  o.start(); o.stop(a.currentTime + dur);
}
function noise(dur, vol, filt, f0, f1) {
  const a = ac(); if (!a) return;
  const s = a.createBufferSource();
  s.buffer = noiseBuf(a);
  const fl = a.createBiquadFilter();
  fl.type = filt;
  fl.frequency.setValueAtTime(f0, a.currentTime);
  fl.frequency.exponentialRampToValueAtTime(f1, a.currentTime + dur);
  const g = a.createGain();
  g.gain.setValueAtTime(vol, a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + dur);
  s.connect(fl).connect(g).connect(a.destination);
  s.start(); s.stop(a.currentTime + dur);
}
function sfx(name) {
  switch (name) {
    case "swing": noise(0.14, 0.25, "highpass", 1500, 4000); break;
    case "hit": tone(140, 50, 0.2, "sine", 0.5); noise(0.08, 0.4, "lowpass", 2000, 400); break;
    case "block": tone(900, 400, 0.12, "square", 0.12); noise(0.1, 0.25, "highpass", 3000, 6000); break;
    case "whoosh": noise(0.3, 0.3, "bandpass", 400, 2500); break;
    case "boing": tone(220, 640, 0.3, "sine", 0.3); break;
    case "ult": tone(220, 880, 0.7, "sawtooth", 0.18); tone(330, 990, 0.7, "triangle", 0.15); noise(0.7, 0.2, "bandpass", 300, 3000); break;
    case "bell": tone(880, 880, 1.2, "sine", 0.25); tone(1320, 1320, 1.0, "sine", 0.1); break;
    case "whistle": tone(2400, 2200, 0.35, "sine", 0.2); break;
    case "shot": noise(0.12, 0.6, "highpass", 800, 3000); tone(120, 40, 0.15, "sine", 0.5); break;
    case "twang": tone(900, 200, 0.25, "triangle", 0.25); break;
    case "throw": noise(0.15, 0.3, "lowpass", 1200, 300); break;
    case "slash": noise(0.16, 0.3, "highpass", 2000, 6000); tone(700, 300, 0.15, "sine", 0.1); break;
    case "click": tone(1200, 1200, 0.03, "square", 0.1); break;
  }
}

/* Pasang suara ke aksi yang sudah ada */
function weaponSfx(a, type) {
  if (type === "jab") return "swing";
  return { pisau: "slash", pedang: "slash", pistol: "shot", ketapel: "twang", batu: "throw" }[a.weapon] || "swing";

const hindarBaseSfx = hindar;

const cycleBaseSfx = cycleWeapon;

const tickBaseSfx = tick;

  switch (m.t) {
    case "pick":
      NET.theirPick = m.i; NET.theirNm = m.nm || "";
      if (NET.myPick < 0) netMsg("Lawan sudah memilih. Giliranmu pilih petinju!");
      if (isHost()) netMaybeStart();
      break;
    case "start":
      if (!isGuest()) break;
      NET.myPick = NET.theirPick = -1; NET.ax = 0;
      twoP = true;
      start(m.pi, m.oi);
      clearInterval(NET.axTimer);
      NET.axTimer = setInterval(() => {
        if (!P) return;
        const v = Math.round(P.ax * 100) / 100;
        if (v !== NET.ax || ++NET.k % 12 === 0) { NET.ax = v; netSend({ t: "ax", v }); }
      }, 40);
      break;
    case "s": if (isGuest()) applySnap(m); break;
    case "log": if (isGuest()) logPrev(m.m); break;
    case "sfx": if (isGuest()) sfxPrev(m.n); break;
    case "ev":
      if (isGuest() && P && O) {
        const e = m.e;
        e.t += performance.now();
        if (e.who) e.who = e.who === "P" ? P : O;
        if (e.target) e.target = e.target === "P" ? P : O;
        (m.k === "fx" ? ultFx : ultAnims).raw(e);
      }
      break;
    case "over":
      if (isGuest()) {
        over = true;
        $("ot").textContent = m.ot; $("os").textContent = m.os;
        $("next").classList.toggle("hidden", !m.nx);
        $("over").classList.remove("hidden");
      }
      break;
    case "in": if (isHost() && P && O && !over) pressPrev("O", m.a); break;
    case "ax": if (isHost() && O) O.ax = +m.v || 0; break;
    case "next": if (isHost() && over && !$("next").classList.contains("hidden")) $("next").onclick(); break;
    case "bye": netGone("Lawan keluar dari room."); break;
  }
}

/* ---- tombol ---- */
$("btnOnline").onclick = () => { netUI("home"); netMsg(""); };
$("netHost").onclick = hostRoom;
$("netJoin").onclick = joinRoom;
$("netCode").addEventListener("keydown", e => { if (e.key === "Enter") joinRoom(); });
$("netCancel").onclick = () => netExit(true);
$("netCopy").onclick = () => {
  const done = () => netMsg("Kode disalin."), fail = () => netMsg("Salin manual: " + NET.code);
  if (navigator.clipboard) navigator.clipboard.writeText(NET.code).then(done, fail); else fail();
};
$("next").onclick = () => {
  if (isGuest()) { netSend({ t: "next" }); $("os").textContent = "Menunggu host melanjutkan..."; return; }
  matchNo++; $("over").classList.add("hidden"); beginMatch();
};
$("quit").onclick = $("again").onclick = () => { if (NET.active) netExit(true); else toMenuOrig(); };
window.addEventListener("pagehide", () => { if (NET.active) netSend({ t: "bye" }); });
</script>
